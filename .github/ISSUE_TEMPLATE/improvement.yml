name: Pre-fork improvement intake
description: Minimal research/decision intake only when no verified working fork metadata exists.
title: "[Intake] "
body:
  - type: markdown
    attributes:
      value: |
        If a matching working fork is verified, keep its detailed improvement record in `.opensiro/contributions/` on separate `opensiro/meta` branch, not a new Upstream issue. Use a minimal intake only before a real matching fork exists. Check [upstream-old](https://github.com/opensiro/upstream-old) before repeating research.
  - type: input
    id: original_source
    attributes:
      label: Original target repository
      description: The real OWNER/REPO, not its opensiro-contributions fork.
      placeholder: owner/repo
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Useful product task or repair
      description: Who needs which observable action/output? Mark unverified predictions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source evidence and optional VSM provenance
      description: Source issue/code, pinned SHA, existing alternative, any Index-first dated checkpoint, and uncertainty.
    validations:
      required: false
  - type: textarea
    id: test
    attributes:
      label: Next native counterfactual or design question
      description: Smallest decisive baseline/negative control or first-party decision still needed.
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: Potential working fork and external PR (if existing)
      description: Do not invent forks, PR numbers or native test successes; once fork verified, detailed history moves to its metadata branch.
    validations:
      required: false
  - type: textarea
    id: next
    attributes:
      label: NEXT — one concrete action and owner
      description: What should the next session do with this same issue?
    validations:
      required: true
