name: AgentBox native task dependency readiness baseline

on:
  pull_request:
    paths:
      - '.github/workflows/agentbox-native-dependency-dispatch.yml'
      - 'pilots/agentbox-s2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-dependency-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout OpenSiro research fixture without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: opensiro
          persist-credentials: false
      - name: Checkout exact public AgentBox source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: madarco/agentbox
          ref: 605ee75d63319003c188bc532d4e5b2ba36a51d6
          path: agentbox
          persist-credentials: false
      - name: Pin and inject test into disposable relay test directory only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C agentbox rev-parse HEAD)" = 605ee75d63319003c188bc532d4e5b2ba36a51d6
          grep -F '"packageManager": "pnpm@9.15.0"' agentbox/package.json
          cp opensiro/pilots/agentbox-s2/assessment_native_dependency_dispatch_baseline.test.ts agentbox/packages/relay/test/zz_opensiro_dependency_dispatch_baseline.test.ts
          test "$(git -C agentbox status --porcelain --untracked-files=all | wc -l)" -eq 1
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'
          run_install: false
      - name: Install pinned original dependencies
        working-directory: agentbox
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Build first-party workspace
        working-directory: agentbox
        timeout-minutes: 14
        run: pnpm build
      - name: Run actual relay task store dependency baseline
        working-directory: agentbox
        timeout-minutes: 5
        run: pnpm --filter @agentbox/relay exec vitest run test/zz_opensiro_dependency_dispatch_baseline.test.ts
      - name: Verify upstream product source not modified
        working-directory: agentbox
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 605ee75d63319003c188bc532d4e5b2ba36a51d6
          test "$(git diff --name-only | wc -l)" -eq 0
