name: Zot native tool and task-boundary assessment

on:
  pull_request:
    paths:
      - '.github/workflows/zot-native-tool-turn-boundaries.yml'
      - 'pilots/zot-shared-workspace/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-tool-turn-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research fixtures without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: opensiro
          persist-credentials: false
      - name: Checkout exact Zot baseline source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: patriceckhart/zot
          ref: c62d1c549d52cd33390968ffa50667cb79609152
          path: zot
          persist-credentials: false
      - name: Verify source and inject research only into ephemeral packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zot rev-parse HEAD)" = c62d1c549d52cd33390968ffa50667cb79609152
          grep -Fx 'go 1.25.0' zot/go.mod
          p=opensiro/pilots/zot-shared-workspace
          cp "$p/experimental_scoped_spawn.go" zot/packages/agent/swarm/zz_opensiro_scoped.go
          cp "$p/experimental_turn_boundary_gap_test.go" zot/packages/agent/swarm/zz_opensiro_turn_gap_test.go
          cp "$p/experimental_native_tools_bypass_test.go" zot/packages/agent/tools/zz_opensiro_tools_gap_test.go
          test "$(git -C zot status --porcelain --untracked-files=all | wc -l)" -eq 3
      - name: Install Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Format only injected disposable copies
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w zot/packages/agent/swarm/zz_opensiro_*.go zot/packages/agent/tools/zz_opensiro_*.go
          test -z "$(gofmt -l zot/packages/agent/swarm/zz_opensiro_*.go zot/packages/agent/tools/zz_opensiro_*.go)"
      - name: Run task-turn and native tool boundary tests with race detector
        working-directory: zot
        timeout-minutes: 16
        run: go test -race ./packages/agent/swarm ./packages/agent/tools -run '^TestAssessment(LongLivedPromptTurnDoesNotReleaseScope|NativeWriteAndEditBypassDeclaredScope)$' -count=1 -v -timeout=3m
      - name: Run full affected Zot package tests
        working-directory: zot
        timeout-minutes: 6
        run: go test ./packages/agent/swarm ./packages/agent/tools -count=1 -timeout=3m
