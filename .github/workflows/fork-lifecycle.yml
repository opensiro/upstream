name: Fork lifecycle (preview only)

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Public upstream OWNER/REPOSITORY'
        required: true
        type: string
      fork_name:
        description: 'Optional destination fork name'
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: main
      - name: Preview only; this workflow cannot create forks
        env:
          FORK_SOURCE: ${{ inputs.source }}
          FORK_NAME: ${{ inputs.fork_name }}
        shell: bash
        run: |
          args=(--source "$FORK_SOURCE")
          if [[ -n "$FORK_NAME" ]]; then args+=(--fork-name "$FORK_NAME"); fi
          python3 scripts/create_fork.py "${args[@]}"
