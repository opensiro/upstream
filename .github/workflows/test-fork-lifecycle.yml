name: Fork lifecycle tests

on:
  pull_request:
    paths:
      - 'scripts/create_fork.py'
      - 'scripts/batch_proposals.py'
      - 'scripts/connected_stage_adapter.py'
      - 'scripts/control_plane_handoff.py'
      - 'tests/test_create_fork.py'
      - 'tests/test_batch_proposals.py'
      - 'tests/test_connected_stage_adapter.py'
      - 'tests/test_control_plane_handoff.py'
      - 'tests/test_osm_delegation_design.py'
      - 'scripts/osm_p1_scope.py'
      - 'tests/test_osm_p1_scope.py'
      - 'docs/P1_SCOPE_PREFLIGHT.md'
      - 'docs/OSM_DELEGATION_DESIGN.md'
      - 'docs/CONTROL_PLANE_HANDOFF.md'
      - 'README.md'
      - '.github/workflows/fork-lifecycle.yml'
      - '.github/workflows/test-fork-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/create_fork.py'
      - 'scripts/batch_proposals.py'
      - 'scripts/connected_stage_adapter.py'
      - 'scripts/control_plane_handoff.py'
      - 'tests/test_create_fork.py'
      - 'tests/test_batch_proposals.py'
      - 'tests/test_connected_stage_adapter.py'
      - 'tests/test_control_plane_handoff.py'
      - 'tests/test_osm_delegation_design.py'
      - 'scripts/osm_p1_scope.py'
      - 'tests/test_osm_p1_scope.py'
      - 'docs/P1_SCOPE_PREFLIGHT.md'
      - 'docs/OSM_DELEGATION_DESIGN.md'
      - 'docs/CONTROL_PLANE_HANDOFF.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline fork lifecycle tests
        run: python3 -m unittest discover -s tests -v
