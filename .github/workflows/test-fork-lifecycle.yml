name: Fork lifecycle tests

on:
  pull_request:
    paths:
      - 'scripts/create_fork.py'
      - 'scripts/batch_proposals.py'
      - 'scripts/connected_stage_adapter.py'
      - 'scripts/connected_fork_adapter.py'
      - 'tests/test_connected_fork_adapter.py'
      - 'docs/CONNECTED_FORK_ADAPTER.md'
      - 'docs/FIRST_LIVE_FORK_TEST.md'
      - 'docs/OPENSIRO_CONTRIBUTIONS_FORK_ROUTE.md'
      - 'scripts/control_plane_handoff.py'
      - 'tests/test_create_fork.py'
      - 'tests/test_batch_proposals.py'
      - 'tests/test_connected_stage_adapter.py'
      - 'tests/test_control_plane_handoff.py'
      - 'tests/test_osm_delegation_design.py'
      - 'scripts/osm_p1_scope.py'
      - 'tests/test_osm_p1_scope.py'
      - 'scripts/osm_p1_pipeline.py'
      - 'scripts/assessment_origin_preflight.py'
      - 'scripts/assessment_driven_handoff.py'
      - 'tests/test_assessment_driven_handoff.py'
      - 'tests/test_assessment_origin_preflight.py'
      - 'tests/test_osm_p1_pipeline.py'
      - 'tests/test_assessment_driven_s1_contract.py'
      - 'tests/test_assessment_driven_first_pilot.py'
      - 'tests/test_harnessdesk_assessment_pilot.py'
      - 'pilots/**'
      - 'docs/ASSESSMENT_DRIVEN_S1_TEST.md'
      - 'reports/2026-10-19-index-origin-s1-pilot.md'
      - 'docs/P1_SCOPE_PREFLIGHT.md'
      - 'docs/OSM_DELEGATION_DESIGN.md'
      - 'docs/CONTROL_PLANE_HANDOFF.md'
      - 'README.md'
      - '.github/workflows/fork-lifecycle.yml'
      - '.github/workflows/test-fork-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/create_fork.py'
      - 'scripts/batch_proposals.py'
      - 'scripts/connected_stage_adapter.py'
      - 'scripts/connected_fork_adapter.py'
      - 'tests/test_connected_fork_adapter.py'
      - 'docs/CONNECTED_FORK_ADAPTER.md'
      - 'docs/FIRST_LIVE_FORK_TEST.md'
      - 'docs/OPENSIRO_CONTRIBUTIONS_FORK_ROUTE.md'
      - 'scripts/control_plane_handoff.py'
      - 'tests/test_create_fork.py'
      - 'tests/test_batch_proposals.py'
      - 'tests/test_connected_stage_adapter.py'
      - 'tests/test_control_plane_handoff.py'
      - 'tests/test_osm_delegation_design.py'
      - 'scripts/osm_p1_scope.py'
      - 'tests/test_osm_p1_scope.py'
      - 'scripts/osm_p1_pipeline.py'
      - 'scripts/assessment_origin_preflight.py'
      - 'scripts/assessment_driven_handoff.py'
      - 'tests/test_assessment_driven_handoff.py'
      - 'tests/test_assessment_origin_preflight.py'
      - 'tests/test_osm_p1_pipeline.py'
      - 'tests/test_assessment_driven_s1_contract.py'
      - 'tests/test_assessment_driven_first_pilot.py'
      - 'tests/test_harnessdesk_assessment_pilot.py'
      - 'pilots/**'
      - 'docs/ASSESSMENT_DRIVEN_S1_TEST.md'
      - 'reports/2026-10-19-index-origin-s1-pilot.md'
      - 'docs/P1_SCOPE_PREFLIGHT.md'
      - 'docs/OSM_DELEGATION_DESIGN.md'
      - 'docs/CONTROL_PLANE_HANDOFF.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline fork lifecycle tests
        run: python3 -m unittest discover -s tests -v
