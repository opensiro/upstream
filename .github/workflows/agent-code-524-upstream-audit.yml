name: Agent-code #524 upstream CI compatibility audit

on:
  pull_request:
    paths:
      - '.github/workflows/agent-code-524-upstream-audit.yml'
      - 'pilots/agent-code-524/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-code-524-upstream-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"

jobs:
  all-targets-linux:
    name: Upstream all-targets Check and Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: opensiro
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: avala-ai/agent-code
          ref: 82e0edfa7372c256d893d0854f954d9099254f88
          path: agent-code
          persist-credentials: false
      - name: Validate pinned source and patch
        shell: bash
        run: |
          set -euo pipefail
          p="$GITHUB_WORKSPACE/opensiro/pilots/agent-code-524/reviewer-subagent-first-slice.patch"
          test "$(sha256sum "$p" | cut -d' ' -f1)" = '58a70a40beafcceef1f76161f869f4fe2366272d8a82ea9fe9b48fcf530235e1'
          test "$(git -C agent-code rev-parse HEAD)" = '82e0edfa7372c256d893d0854f954d9099254f88'
          git -C agent-code apply --check "$p"
          git -C agent-code apply "$p"
          git -C agent-code diff --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "agent-code"
      - name: Install ripgrep (original upstream test dependency)
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Upstream format gate
        working-directory: agent-code
        run: cargo fmt --all -- --check
      - name: Upstream check gate (all targets)
        working-directory: agent-code
        run: cargo check --all-targets --locked
      - name: Upstream test gate (all targets)
        working-directory: agent-code
        run: cargo test --all-targets --locked

  strict-clippy-linux:
    name: Upstream strict Clippy diagnostic-location parity (not strict PASS)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: opensiro
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: avala-ai/agent-code
          ref: 82e0edfa7372c256d893d0854f954d9099254f88
          path: agent-code
          persist-credentials: false
      - name: Verify original source and script self-tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C agent-code rev-parse HEAD)" = '82e0edfa7372c256d893d0854f954d9099254f88'
          python3 -m unittest discover -s opensiro/pilots/agent-code-524 -p 'test_verify_clippy_baseline.py' -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "agent-code"
      - name: Run unqualified strict Clippy on pristine upstream baseline (expect exact errors)
        working-directory: agent-code
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo clippy --all-targets --locked --message-format=json -- -D warnings > baseline-clippy.jsonl 2> baseline-clippy.stderr
          status=$?
          set -e
          python3 ../opensiro/pilots/agent-code-524/verify_clippy_baseline.py --jsonl baseline-clippy.jsonl --clippy-exit "$status" --side baseline
      - name: Apply exact reviewer patch after baseline gate
        shell: bash
        run: |
          set -euo pipefail
          p="$GITHUB_WORKSPACE/opensiro/pilots/agent-code-524/reviewer-subagent-first-slice.patch"
          test "$(sha256sum "$p" | cut -d' ' -f1)" = '58a70a40beafcceef1f76161f869f4fe2366272d8a82ea9fe9b48fcf530235e1'
          git -C agent-code apply --check "$p"
          git -C agent-code apply "$p"
          git -C agent-code diff --check
      - name: Run unqualified strict Clippy on patched source (require same unique lint locations)
        working-directory: agent-code
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo clippy --all-targets --locked --message-format=json -- -D warnings > patched-clippy.jsonl 2> patched-clippy.stderr
          status=$?
          set -e
          python3 ../opensiro/pilots/agent-code-524/verify_clippy_baseline.py --jsonl patched-clippy.jsonl --clippy-exit "$status" --side patched
          echo "PATCH_INTRODUCED_STRICT_CLIPPY_DIAGNOSTICS=0 (only if this verification passed)"
          echo "UNQUALIFIED_STRICT_CLIPPY=FAILS_ON_IDENTICAL_BASELINE_WARNING_LOCATIONS"

  all-targets-windows:
    name: Upstream all-targets Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Preserve Git blob line endings for exact patch SHA on Windows
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: opensiro
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: avala-ai/agent-code
          ref: 82e0edfa7372c256d893d0854f954d9099254f88
          path: agent-code
          persist-credentials: false
      - name: Validate and apply SHA-pinned patch
        shell: pwsh
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE 'opensiro/pilots/agent-code-524/reviewer-subagent-first-slice.patch'
          $actual = (Get-FileHash -Algorithm SHA256 $patch).Hash.ToLowerInvariant()
          if ($actual -ne '58a70a40beafcceef1f76161f869f4fe2366272d8a82ea9fe9b48fcf530235e1') { throw 'Patch checksum mismatch' }
          if ((git -C agent-code rev-parse HEAD) -ne '82e0edfa7372c256d893d0854f954d9099254f88') { throw 'Upstream source mismatch' }
          git -C agent-code apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch cannot apply' }
          git -C agent-code apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch apply failed' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "agent-code"
      - name: Install ripgrep (upstream test dependency)
        shell: pwsh
        run: choco install ripgrep -y
      - name: Original upstream all-targets Windows test gate
        working-directory: agent-code
        run: cargo test --all-targets --locked
