name: Upstream lifecycle change proposal (guarded)

on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:
    inputs:
      create_draft_pr:
        description: 'Explicit human-triggered internal Draft PR (requires repository Actions PR creation permission)'
        type: boolean
        required: true
        default: false

concurrency:
  group: upstream-lifecycle-proposal
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source contract and generated baseline
        run: |
          python3 -m unittest discover -s tests -p 'test_upstream_status.py' -v
          python3 scripts/upstream_status.py --check-generated
      - name: Observe public PRs and prepare local patch only if status changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/upstream_status.py --propose-if-drift
          python3 scripts/upstream_status.py --check-generated
          python3 scripts/harness_status.py --check
          git diff --check
      - name: Guard exact changed-file scope and emit review patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              DASHBOARD.md|docs/index.html|cases/README.md|data/upstream-lifecycle.json) ;;
              *) echo "Unexpected status proposal path: $file" >&2; exit 1 ;;
            esac
          done < <(git status --porcelain | sed 's/^...//')
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No PR lifecycle drift; no proposed change.' >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --binary -- DASHBOARD.md docs/index.html cases/README.md data/upstream-lifecycle.json > "$RUNNER_TEMP/upstream-lifecycle-proposal.patch"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Source-backed status change prepared as a reviewable patch. No repository write was performed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve reviewed patch for 30 days
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-lifecycle-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-lifecycle-proposal.patch
          if-no-files-found: error
          retention-days: 30

  internal_draft_pr:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft_pr == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-check sources and regenerate reviewable files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m unittest discover -s tests -p 'test_upstream_status.py' -v
          python3 scripts/upstream_status.py --check-generated
          python3 scripts/upstream_status.py --propose-if-drift
          python3 scripts/upstream_status.py --check-generated
          python3 scripts/harness_status.py --check
          git diff --check
      - name: Confirm proposed file scope
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              DASHBOARD.md|docs/index.html|cases/README.md|data/upstream-lifecycle.json) ;;
              *) echo "Unexpected status proposal path: $file" >&2; exit 1 ;;
            esac
          done < <(git status --porcelain | sed 's/^...//')
      - name: Open or update one internal Draft PR only
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            data/upstream-lifecycle.json
            DASHBOARD.md
            docs/index.html
            cases/README.md
          branch: bot/upstream-lifecycle-status
          base: main
          draft: true
          delete-branch: false
          commit-message: 'chore(upstream): propose verified external PR status updates'
          title: 'chore(upstream): review source-verified external PR status drift'
          body: |
            Generated only after explicitly selected `workflow_dispatch.create_draft_pr=true`.
            Source URLs are pinned in the historical cohort and fork registry; live PR
            lifecycle is read back from GitHub. No Product-native fit scores are changed.

            **Human review and a separate merge decision are required.** GitHub Actions
            `GITHUB_TOKEN`-created PRs may not trigger ordinary pull_request CI; run
            the required checks and verify the source timestamp before merging.
            The bot does not edit third-party repositories or close/merge PRs.
