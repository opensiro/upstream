name: Repository integrity (all PRs)

# Stable unfiltered status context for future required-check enforcement.
# Keep this workflow free of path filters so unrelated PRs are not left pending.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline repository unit tests
        run: python3 -m unittest discover -s tests -v
