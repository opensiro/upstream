name: Validate Upstream protocol
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local consistency and unit checks
        run: |
          python3 scripts/validate_contract.py
          python3 -m unittest discover -s tests -v
