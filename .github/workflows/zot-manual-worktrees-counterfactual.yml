name: Zot manual worktree counterfactual

on:
  pull_request:
    paths:
      - '.github/workflows/zot-manual-worktrees-counterfactual.yml'
      - 'pilots/zot-shared-workspace/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-worktrees:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout OpenSiro fixtures without GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: opensiro
          persist-credentials: false
      - name: Checkout immutable public Zot baseline without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: patriceckhart/zot
          ref: c62d1c549d52cd33390968ffa50667cb79609152
          path: zot
          persist-credentials: false
      - name: Assert exact source and inject test only into disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zot rev-parse HEAD)" = c62d1c549d52cd33390968ffa50667cb79609152
          grep -Fx 'go 1.25.0' zot/go.mod
          cp opensiro/pilots/zot-shared-workspace/experimental_manual_worktrees_counterfactual_test.go zot/packages/agent/tools/zz_opensiro_manual_worktrees_test.go
          test "$(git -C zot status --porcelain --untracked-files=all | wc -l)" -eq 1
      - name: Install pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Check formatting of injected test
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w zot/packages/agent/tools/zz_opensiro_manual_worktrees_test.go
          test -z "$(gofmt -l zot/packages/agent/tools/zz_opensiro_manual_worktrees_test.go)"
      - name: Matched real WriteTool and git-worktree test under race detector
        working-directory: zot
        timeout-minutes: 15
        run: go test -race ./packages/agent/tools -run '^TestAssessmentNativeWriteManualWorktreeCounterfactual$' -count=1 -v -timeout=4m
      - name: Full native affected package suite
        working-directory: zot
        timeout-minutes: 4
        run: go test ./packages/agent/swarm ./packages/agent/tools -count=1 -timeout=3m
