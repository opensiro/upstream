name: Refresh Upstream external PR dashboard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-activity.yml'
      - 'scripts/refresh_dashboard.py'
      - 'scripts/activity.py'
      - 'scripts/aggregate.py'

# Source metadata and external PR reads are read-only. The only writes are to
# a review branch/PR in opensiro/upstream, never to forks or original projects.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-activity-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Test Upstream protocol, aggregate and activity code
        run: |
          python3 scripts/validate_contract.py
          python3 -m unittest discover -s tests -v

      - name: Read verified fork-local metadata at exact refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if python3 scripts/aggregate.py --no-prs --format json > "$RUNNER_TEMP/opensiro-portfolio.json"; then
            echo "Verified fork-local metadata scan completed"
          else
            python3 - "$RUNNER_TEMP/opensiro-portfolio.json" <<'PY_AUDIT'
          import json
          import sys
          from pathlib import Path
          try:
              report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              print("Incomplete metadata scan coverage:", report.get("coverage"))
              for warning in report.get("warnings", [])[:30]:
                  print("WARNING:", warning)
              if len(report.get("warnings", [])) > 30:
                  print("Additional warnings omitted; see the run's raw report")
          except (OSError, ValueError) as error:
              print("Metadata scan stopped before a valid JSON report:", error)
          PY_AUDIT
            echo "::error::Metadata scan is incomplete; dashboard publication withheld"
            exit 1
          fi

      - name: Reuse an already-open bot PR as the comparison baseline
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/activity-dashboard-refresh"
          pending="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --state open --json number --jq 'length')"
          echo "exists=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" -gt 1 ]; then
            echo "::error::Multiple open dashboard refresh PRs; refusing ambiguous update"
            exit 1
          fi
          if [ "$pending" -eq 1 ]; then
            git fetch --no-tags origin "$branch:refs/remotes/origin/$branch"
            git restore --source="refs/remotes/origin/$branch" --staged --worktree -- \
              docs/activity.svg docs/ACTIVITY.md docs/activity-sources.json
            echo "Comparing against the already-pending dashboard snapshot"
          fi

      - name: Refresh only on source-backed lifecycle changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/refresh_dashboard.py \
            --input "$RUNNER_TEMP/opensiro-portfolio.json" \
            --svg docs/activity.svg \
            --markdown docs/ACTIVITY.md \
            --sources docs/activity-sources.json \
            --upstream-revision "$(git rev-parse HEAD)" \
            --audit-output "$RUNNER_TEMP/activity-observation.json"

      - name: Upload exact source/provenance receipts for this run
        uses: actions/upload-artifact@v4
        with:
          name: upstream-activity-observation
          path: |
            ${{ runner.temp }}/opensiro-portfolio.json
            ${{ runner.temp }}/activity-observation.json
          if-no-files-found: error
          retention-days: 30

      # Updating an already-open PR's review branch is allowed even when the
      # repository disallows GITHUB_TOKEN creation of *new* pull requests.
      # Compare against the fetched remote snapshot, not main, to avoid
      # timestamp-only churn and preserve human review on the same PR.
      - name: Update existing review PR branch (never main)
        if: steps.pending.outputs.exists == '1'
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/activity-dashboard-refresh"
          old="$(git rev-parse "refs/remotes/origin/$branch")"
          if git diff --quiet "$old" -- docs/activity.svg docs/ACTIVITY.md docs/activity-sources.json; then
            echo "Source facts unchanged relative to existing review PR; no commit or push"
            exit 0
          fi
          git add -- docs/activity.svg docs/ACTIVITY.md docs/activity-sources.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "docs(activity): refresh verified external PR activity"
          git push --force-with-lease="refs/heads/$branch:$old" \
              origin "HEAD:refs/heads/$branch"
          echo "Updated existing dashboard review PR branch from pinned base"

      # A repository setting still controls *new* PR creation; do not bypass
      # that owner gate with alternate credentials or direct commits to main.
      # GITHUB_TOKEN-created PRs do not retrigger PR CI; unit/contract checks
      # have already run in this workflow.
      - name: Create a new review PR only if none is open (never auto-merge)
        if: steps.pending.outputs.exists == '0'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/activity-dashboard-refresh
          delete-branch: true
          add-paths: |
            docs/activity.svg
            docs/ACTIVITY.md
            docs/activity-sources.json
          commit-message: "docs(activity): refresh external PR lifecycle dashboard"
          title: "docs(activity): refresh source-verified external PR dashboard"
          body: |
            Automated **review-only** update from verified fork-local `.opensiro`
            records and first-party original-repository GitHub PR/review APIs.

            - Source SHA, readback timestamps, coverage and checksums are in
              `docs/activity-sources.json`.
            - GitHub API failures, malformed or attention-filtered scans, and
              partial PR/review reads fail closed, without a dashboard commit.
            - No commit is made for a timestamp-only refresh; changed records
              or original PR lifecycle facts update this same PR branch.
            - This is bounded PR lifecycle activity, **not** an Organization
              `verified_external_outcomes` claim or deployed-benefit metric.
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Human review/merge required. No source forks or external PRs modified.
          draft: false
