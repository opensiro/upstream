name: Refresh Upstream external PR dashboard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-activity.yml'
      - 'scripts/refresh_dashboard.py'
      - 'scripts/activity.py'
      - 'scripts/aggregate.py'

# Only the three derived dashboard files may be written to Upstream main.
# Original repositories and fork-local metadata are read-only.
permissions:
  contents: write

concurrency:
  group: upstream-activity-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Test Upstream protocol, aggregate and activity code
        run: |
          python3 scripts/validate_contract.py
          python3 -m unittest discover -s tests -v

      - name: Read verified fork-local metadata at exact refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if python3 scripts/aggregate.py --no-prs --format json > "$RUNNER_TEMP/opensiro-portfolio.json"; then
            echo "Verified fork-local metadata scan completed"
          else
            python3 - "$RUNNER_TEMP/opensiro-portfolio.json" <<'PY_AUDIT'
          import json
          import sys
          from pathlib import Path
          try:
              report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              print("Incomplete metadata scan coverage:", report.get("coverage"))
              for warning in report.get("warnings", [])[:30]:
                  print("WARNING:", warning)
              if len(report.get("warnings", [])) > 30:
                  print("Additional warnings omitted; see the run's raw report")
          except (OSError, ValueError) as error:
              print("Metadata scan stopped before a valid JSON report:", error)
          PY_AUDIT
            echo "::error::Metadata scan is incomplete; dashboard publication withheld"
            exit 1
          fi

      - name: Refresh only on source-backed lifecycle changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/refresh_dashboard.py \
            --input "$RUNNER_TEMP/opensiro-portfolio.json" \
            --svg docs/activity.svg \
            --markdown docs/ACTIVITY.md \
            --sources docs/activity-sources.json \
            --upstream-revision "$(git rev-parse HEAD)" \
            --audit-output "$RUNNER_TEMP/activity-observation.json"

      - name: Upload exact source/provenance receipts for this run
        uses: actions/upload-artifact@v4
        with:
          name: upstream-activity-observation
          path: |
            ${{ runner.temp }}/opensiro-portfolio.json
            ${{ runner.temp }}/activity-observation.json
          if-no-files-found: error
          retention-days: 30

      # Native tests, scan completeness and original-repository readbacks have
      # passed. Push a derived-data-only commit without new PR permissions.
      # Normal non-force Git push rejects concurrent main updates and rulesets.
      - name: Publish verified snapshot directly to main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          git add -- docs/ACTIVITY.md docs/activity.svg docs/activity-sources.json
          if git diff --cached --quiet; then
            echo "Dashboard source facts unchanged; no commit"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "docs(activity): publish verified snapshot"
          git push origin HEAD:refs/heads/main
          echo "Verified derived snapshot published to main (no PR)"
