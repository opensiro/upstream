name: HarnessDesk #1772 V2 current pinned full push gate

on:
  pull_request:
    paths:
      - '.github/workflows/harnessdesk-v2-current-full-gate.yml'
      - 'pilots/harnessdesk-1772/tool-gateway-ownership-fix-v2.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-full-check:
    name: V2 at 81d5e34 — full check:push, no fork writes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout OpenSiro patch (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: opensiro
          persist-credentials: false
      - name: Checkout exact external source with main ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HarnessDesk/HarnessDesk
          ref: 81d5e34e0e8e3d7e0945bc680695940b41ab852f
          fetch-depth: 0
          path: harnessdesk
          persist-credentials: false
      - name: Validate exact source, patch digest and two-file scope
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/opensiro/pilots/harnessdesk-1772/tool-gateway-ownership-fix-v2.patch"
          test "$(git -C harnessdesk rev-parse HEAD)" = '81d5e34e0e8e3d7e0945bc680695940b41ab852f'
          test "$(sha256sum "$PATCH" | cut -d' ' -f1)" = '12b5c7e55a6f730fb9a2465ca30dd47321690c87c0d887e7b8c9d6990ec186e7'
          git -C harnessdesk apply --check "$PATCH"
          git -C harnessdesk apply "$PATCH"
          git -C harnessdesk diff --check
          git -C harnessdesk status --short
          test "$(git -C harnessdesk diff --name-only | wc -l)" -eq 1
          test "$(git -C harnessdesk status --porcelain --untracked-files=all | wc -l)" -eq 2
          test -f harnessdesk/packages/server/test/tool-gateway-ownership.test.ts
          git -C harnessdesk show-ref --verify refs/remotes/origin/main
      - name: Install Node 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install pnpm 10.4.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Install locked dependencies without lifecycle scripts
        working-directory: harnessdesk
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run upstream full required local push gate
        working-directory: harnessdesk
        timeout-minutes: 32
        run: pnpm check:push
