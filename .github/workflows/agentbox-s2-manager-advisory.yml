name: AgentBox assessment-derived S2 manager advisory prototype

on:
  pull_request:
    paths:
      - '.github/workflows/agentbox-s2-manager-advisory.yml'
      - 'pilots/agentbox-s2/manager-advisory/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-agentbox-advisory:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: opensiro
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: madarco/agentbox
          ref: 605ee75d63319003c188bc532d4e5b2ba36a51d6
          path: agentbox
          persist-credentials: false
      - name: Check source pin and inject two untracked, opt-in research files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C agentbox rev-parse HEAD)" = '605ee75d63319003c188bc532d4e5b2ba36a51d6'
          cp opensiro/pilots/agentbox-s2/manager-advisory/module.ts agentbox/apps/cli/src/lib/zz_opensiro_manager_advisory.ts
          cp opensiro/pilots/agentbox-s2/manager-advisory/module.test.ts agentbox/apps/cli/test/zz_opensiro_manager_advisory.test.ts
          test "$(git -C agentbox status --porcelain --untracked-files=all | wc -l)" -eq 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'
          run_install: false
      - name: Install original source lockfile
        working-directory: agentbox
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Build original native dependency graph with additive advisory
        working-directory: agentbox
        timeout-minutes: 15
        run: pnpm build
      - name: Execute new first-party TypeScript/Vitest regression scenarios
        working-directory: agentbox
        run: pnpm --filter @madarco/agentbox exec vitest run test/zz_opensiro_manager_advisory.test.ts
      - name: Check actual AgentBox TypeScript and ESLint
        working-directory: agentbox
        run: |
          pnpm --filter @madarco/agentbox typecheck
          pnpm --filter @madarco/agentbox lint
      - name: Verify upstream checkout had no tracked edits
        working-directory: agentbox
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 0
          test "$(git status --porcelain --untracked-files=all | wc -l)" -eq 2
