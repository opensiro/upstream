name: Improvement candidate intake integrity

on:
  pull_request:
    paths:
      - 'candidates/**'
      - 'scripts/inspect_improvement_candidates.py'
      - 'scripts/improvement_candidate_linkage.py'
      - 'tests/test_inspect_improvement_candidates.py'
      - 'tests/test_improvement_candidate_linkage.py'
      - 'docs/IMPROVEMENT_CANDIDATES_PIPELINE_DRAFT.md'
      - '.github/workflows/improvement-candidates.yml'
  push:
    branches: [main]
    paths:
      - 'candidates/**'
      - 'scripts/inspect_improvement_candidates.py'
      - 'tests/test_inspect_improvement_candidates.py'
      - 'docs/IMPROVEMENT_CANDIDATES_PIPELINE_DRAFT.md'
      - '.github/workflows/improvement-candidates.yml'

permissions:
  contents: read

jobs:
  offline-inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Candidate metadata fail-closed tests
        run: python3 -m unittest discover -s tests -p 'test_inspect_improvement_candidates.py' -v
      - name: Candidate-to-proposal linkage fail-closed tests
        run: python3 -m unittest discover -s tests -p 'test_improvement_candidate_linkage.py' -v
      - name: Read-only candidate inventory
        run: python3 scripts/inspect_improvement_candidates.py --root candidates --format text
