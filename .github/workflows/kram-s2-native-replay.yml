name: Kram Index-first S2 native before-and-after replay

on:
  pull_request:
    paths:
      - '.github/workflows/kram-s2-native-replay.yml'
      - 'pilots/kram-s2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: opensiro
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: codexmark/kram
          ref: 5f18406709f432dbdb2d6b09da6f140385516366
          path: kram
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - name: Verify immutable Kram source and checked-in patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C kram rev-parse HEAD)" = '5f18406709f432dbdb2d6b09da6f140385516366'
          echo 'c8877dda2405f6d18d5c0693c3620115c8b57907248b4f6c3d42007dec0d030b  opensiro/pilots/kram-s2/s2-edit-file-atomicity-v2.patch' | sha256sum --check
          test -z "$(git -C kram status --porcelain)"
      - name: Inject only native replay tests into unmodified source
        shell: bash
        working-directory: kram
        run: |
          set -euo pipefail
          git apply --include='*s2_replay_test.go' --include='*s2_delegate_replay_test.go' ../opensiro/pilots/kram-s2/s2-edit-file-atomicity-v2.patch
          test -z "$(git diff --name-only)"
          test "$(git ls-files --others --exclude-standard | wc -l)" -eq 2
      - name: BEFORE — exercise original shipped tool (failure is expected)
        shell: bash
        working-directory: kram
        run: |
          set -uo pipefail
          # GitHub's default bash shell enables errexit. An original RED
          # regression is expected evidence, not a reason to skip AFTER.
          set +e
          go test ./internal/daemon/tools -run '^TestS2(SameFileEditReplay|SeparateFilesControl|CompetingSameMarker|DelegatedRegistryReplay)$' -count=1 -v 2>&1 | tee /tmp/kram-s2-before.log
          result=${PIPESTATUS[0]}
          set -e
          if test "$result" -eq 0; then
            echo 'Original code unexpectedly passed: no demonstrated baseline defect' >&2
            exit 1
          fi
          grep -q 'S2_REPLAY same_path trials=50' /tmp/kram-s2-before.log
          grep -q 'S2_DELEGATED_REGISTRY trials=30' /tmp/kram-s2-before.log
          grep -q 'S2_REPLAY separate_path trials=50 completed=50' /tmp/kram-s2-before.log
          grep -Eq 'lost=[1-9][0-9]*' /tmp/kram-s2-before.log
      - name: Apply only the isolated production edit_file patch
        shell: bash
        working-directory: kram
        run: |
          set -euo pipefail
          git apply --include='*edit_file.go' ../opensiro/pilots/kram-s2/s2-edit-file-atomicity-v2.patch
          test "$(git diff --name-only)" = 'internal/daemon/tools/edit_file.go'
          git diff --check
      - name: AFTER — repeated native and delegated-registry tests with race detector
        shell: bash
        working-directory: kram
        run: go test -race ./internal/daemon/tools -run '^TestS2(SameFileEditReplay|SeparateFilesControl|CompetingSameMarker|DelegatedRegistryReplay)$' -count=1 -v
      - name: Native repository verification (no provider credentials or external writes)
        shell: bash
        working-directory: kram
        timeout-minutes: 25
        run: bash scripts/verify.sh
