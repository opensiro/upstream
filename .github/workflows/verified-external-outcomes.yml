name: External outcome evidence verification (read-only)

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/corrective-publication/**'
      - 'data/improvement-publication/**'
      - 'data/upstream-fit-snapshot.json'
      - 'registry.yaml'
      - 'data/pr-maintenance/targets.json'
      - 'scripts/verified_external_outcomes.py'
      - 'scripts/accepted_external_outcomes.py'
      - 'scripts/portfolio_reconcile.py'
      - 'tests/test_verified_external_outcomes.py'
      - 'tests/test_accepted_external_outcomes.py'
      - 'data/verified-external-outcomes/**'
      - '.github/workflows/verified-external-outcomes.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: upstream-outcome-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source/identity/evidence contract tests
        run: |
          python3 scripts/verified_external_outcomes.py --validate-only
          python3 -m unittest discover -s tests -p 'test_verified_external_outcomes.py' -v
          python3 scripts/accepted_external_outcomes.py --validate-only
          python3 -m unittest discover -s tests -p 'test_accepted_external_outcomes.py' -v

  observe:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe exact third-party PRs and pinned native CI evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verified_external_outcomes.py --report --output-json "$RUNNER_TEMP/upstream-external-outcomes.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate accepted outcomes against live source and owner review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/accepted_external_outcomes.py \
            --observation-json "$RUNNER_TEMP/upstream-external-outcomes.json" \
            --output-json "$RUNNER_TEMP/upstream-accepted-outcomes.json"
      - name: Upload candidate and separately labeled accepted-source ledgers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-external-outcomes-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/upstream-external-outcomes.json
            ${{ runner.temp }}/upstream-accepted-outcomes.json
          if-no-files-found: error
          retention-days: 90
